name: MPAY V2 build and upload

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mpay-v2-deploy
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout deployment branch
        uses: actions/checkout@v4
        with:
          ref: feature/manual-payment-link
          persist-credentials: false

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, redis, mbstring, zip, xml, gd, fileinfo, curl, bcmath, pcntl, sockets
          coverage: none
          tools: composer:v2

      - name: Validate PHP syntax
        run: |
          set -euo pipefail
          find app config support database -type f -name '*.php' -print0 |
            xargs -0 -r -n1 -P4 php -l > /dev/null
          echo "PHP syntax checks passed."

      - name: Resolve Composer lock and install production dependencies
        run: |
          set -euo pipefail
          composer update phpoffice/phpspreadsheet --with-dependencies --no-interaction --no-progress
          composer validate --no-check-publish
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          composer check-platform-reqs --no-dev

      - name: Build and checksum deployment archive
        run: |
          set -euo pipefail
          test -d vendor
          test -f public/index.html
          test -f composer.lock
          test -f deploy/php.Dockerfile
          SOURCE_SHA="$(git rev-parse HEAD)"
          ARCHIVE_NAME="mpay-v2-${SOURCE_SHA}.tgz"
          echo "SOURCE_SHA=${SOURCE_SHA}" >> "${GITHUB_ENV}"
          tar \
            --exclude='./app/command/tests' \
            --exclude='./runtime' \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./tests' \
            --exclude='./.env' \
            -czf "${ARCHIVE_NAME}" \
            app config database deploy public support vendor \
            composer.json composer.lock webman start.php .env.example
          tar -tzf "${ARCHIVE_NAME}" > /dev/null
          sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          cat "${ARCHIVE_NAME}.sha256"
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> "${GITHUB_ENV}"

      - name: Keep build archive as a GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpay-v2-${{ env.SOURCE_SHA }}
          path: |
${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Configure verified SSH
        env:
          SSH_HOST: ${{ secrets.MPAY_SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.MPAY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.MPAY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${SSH_HOST}" && test -n "${SSH_PRIVATE_KEY}" && test -n "${SSH_KNOWN_HOSTS}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/mpay_deploy
          chmod 600 ~/.ssh/mpay_deploy
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/known_hosts

      - name: Upload archive to /opt/mpay-v2 and verify checksum
        env:
          SSH_HOST: ${{ secrets.MPAY_SSH_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/mpay_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes root@"${SSH_HOST}" \
            'mkdir -p /opt/mpay-v2'
          scp -i ~/.ssh/mpay_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${ARCHIVE_NAME}" "${ARCHIVE_NAME}.sha256" \
            root@"${SSH_HOST}":/opt/mpay-v2/
          ssh -i ~/.ssh/mpay_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes root@"${SSH_HOST}" \
            "cd /opt/mpay-v2 && sha256sum -c '${ARCHIVE_NAME}.sha256' && tar -tzf '${ARCHIVE_NAME}' > /dev/null && echo 'MPAY V2 archive upload and verification passed.'"

      - name: Read-only production inventory
        env:
          SSH_HOST: ${{ secrets.MPAY_SSH_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/mpay_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes root@"${SSH_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "=== HOST ==="
          hostname
          date -Is
          echo "=== DOCKER VERSION ==="
          docker info --format 'Docker={{.ServerVersion}} Root={{.DockerRootDir}}'
          echo "=== ALL CONTAINERS ==="
          docker ps -a --no-trunc --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'
          echo "=== CONTAINER DETAILS (NO SECRET VALUES) ==="
          for id in $(docker ps -aq); do
            name=$(docker inspect -f '{{.Name}}' "$id" | sed 's#^/##')
            echo "--- $name ---"
            docker inspect --format 'Image={{.Config.Image}} State={{.State.Status}} Restart={{.HostConfig.RestartPolicy.Name}} NetworkMode={{.HostConfig.NetworkMode}}' "$id"
            docker inspect --format 'Ports={{json .HostConfig.PortBindings}}' "$id"
            docker inspect --format 'Mounts={{range .Mounts}}{{.Type}}:{{.Source}} -> {{.Destination}} (RW={{.RW}}); {{end}}' "$id"
            docker inspect --format 'Networks={{range $name, $cfg := .NetworkSettings.Networks}}{{$name}} {{end}}' "$id"
            docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$id" | sed 's/=.*//' | sort -u | sed 's/^/Env key: /'
            docker inspect --format '{{range $k, $v := .Config.Labels}}{{if or (contains $k "1panel") (contains $k "compose")}}{{printf "%s=%s\n" $k $v}}{{end}}{{end}}' "$id" || true
          done
          echo "=== DOCKER NETWORKS ==="
          docker network ls
          echo "=== DOCKER VOLUMES ==="
          docker volume ls
          echo "=== MPAY DIRECTORY TREE (NAMES, MODES, SIZES ONLY) ==="
          for d in /opt/mpay-v2 /opt/mpay-v2/releases /opt/mpay-v2/releases/v1 /opt/mpay-v2/shared; do
            if [ -d "$d" ]; then
              echo "--- $d ---"
              find "$d" -maxdepth 3 -printf '%y %m %u:%g %s %p\n' 2>/dev/null | sort | head -250
            fi
          done
          echo "=== ENV FILE PATHS ONLY ==="
          find /opt/mpay-v2 -maxdepth 6 -type f -name '.env' -printf '%p mode=%m owner=%u:%g size=%s\n' 2>/dev/null | sort || true
          echo "=== COMPOSE AND DOCKER CONFIG PATHS ==="
          find /opt/mpay-v2 /opt/1panel/apps -maxdepth 7 -type f \( -iname 'docker-compose.yml' -o -iname 'docker-compose.yaml' -o -iname 'compose.yml' -o -iname 'compose.yaml' -o -iname 'Dockerfile' \) -printf '%p mode=%m owner=%u:%g size=%s\n' 2>/dev/null | sort | head -200 || true
          echo "=== LISTENING TCP PORTS ==="
          ss -lntp 2>/dev/null | head -100 || true
          echo "=== RECENT MPAY ARCHIVES ==="
          find /opt/mpay-v2 -maxdepth 1 -type f -name 'mpay-v2-*.tgz' -printf '%f %s bytes\n' 2>/dev/null | sort | tail -10 || true
          echo "Read-only inventory complete. No application files, .env values, database, volumes, networks, or containers were changed."
          REMOTE
