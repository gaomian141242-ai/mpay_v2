name: MPAY V2 build and upload

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mpay-v2-deploy
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout deployment branch
        uses: actions/checkout@v4
        with:
          ref: feature/manual-payment-link
          persist-credentials: false

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, redis, mbstring, zip, xml, gd, fileinfo, curl, bcmath, pcntl, sockets
          coverage: none
          tools: composer:v2

      - name: Validate PHP syntax
        run: |
          set -euo pipefail
          find app config support database -type f -name '*.php' -print0 |
            xargs -0 -r -n1 -P4 php -l > /dev/null
          echo "PHP syntax checks passed."

      - name: Resolve Composer lock and install production dependencies
        run: |
          set -euo pipefail
          composer update phpoffice/phpspreadsheet --with-dependencies --no-interaction --no-progress
          composer validate --no-check-publish
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          composer check-platform-reqs --no-dev

      - name: Build and checksum deployment archive
        run: |
          set -euo pipefail
          test -d vendor
          test -f public/index.html
          test -f composer.lock
          test -f deploy/php.Dockerfile
          SOURCE_SHA="$(git rev-parse HEAD)"
          ARCHIVE_NAME="mpay-v2-${SOURCE_SHA}.tgz"
          echo "SOURCE_SHA=${SOURCE_SHA}" >> "${GITHUB_ENV}"
          tar \
            --exclude='./app/command/tests' \
            --exclude='./runtime' \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./tests' \
            --exclude='./.env' \
            -czf "${ARCHIVE_NAME}" \
            app config database deploy public support vendor \
            composer.json composer.lock webman start.php .env.example
          tar -tzf "${ARCHIVE_NAME}" > /dev/null
          sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          cat "${ARCHIVE_NAME}.sha256"
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> "${GITHUB_ENV}"

      - name: Keep build archive as a GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpay-v2-${{ env.SOURCE_SHA }}
          path: |
            mpay-v2-${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Configure verified SSH
        env:
          SSH_HOST: ${{ secrets.MPAY_SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.MPAY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.MPAY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${SSH_HOST}" && test -n "${SSH_PRIVATE_KEY}" && test -n "${SSH_KNOWN_HOSTS}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/mpay_deploy
          chmod 600 ~/.ssh/mpay_deploy
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/known_hosts

      - name: Upload archive to /opt/mpay-v2 and verify checksum
        env:
          SSH_HOST: ${{ secrets.MPAY_SSH_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/mpay_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes root@"${SSH_HOST}" \
            'mkdir -p /opt/mpay-v2'
          scp -i ~/.ssh/mpay_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${ARCHIVE_NAME}" "${ARCHIVE_NAME}.sha256" \
            root@"${SSH_HOST}":/opt/mpay-v2/
          ssh -i ~/.ssh/mpay_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes root@"${SSH_HOST}" \
            "cd /opt/mpay-v2 && sha256sum -c '${ARCHIVE_NAME}.sha256' && tar -tzf '${ARCHIVE_NAME}' > /dev/null && echo 'MPAY V2 archive upload and verification passed.'"

      - name: Read-only production preflight
        env:
          SSH_HOST: ${{ secrets.MPAY_SSH_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/mpay_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes root@"${SSH_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "=== Host ==="
          hostname
          echo "=== Docker availability ==="
          if ! command -v docker >/dev/null 2>&1; then
            echo "Docker is not installed or not in PATH."
            exit 0
          fi
          docker info --format 'Docker={{.ServerVersion}}'
          echo "=== MPAY containers ==="
          docker ps -a --filter 'name=mpay' --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'
          if docker inspect mpay-v2-php >/dev/null 2>&1; then
            echo "=== Current mpay-v2-php container (non-secret metadata only) ==="
            docker inspect --format 'Image={{.Config.Image}} State={{.State.Status}} Restart={{.HostConfig.RestartPolicy.Name}}' mpay-v2-php
            docker inspect --format 'Ports={{json .HostConfig.PortBindings}}' mpay-v2-php
            docker inspect --format 'Mounts={{range .Mounts}}{{.Source}} -> {{.Destination}}; {{end}}' mpay-v2-php
            docker inspect --format 'Networks={{range $name, $cfg := .NetworkSettings.Networks}}{{$name}} {{end}}' mpay-v2-php
            docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' mpay-v2-php | sed 's/=.*//' | sort -u | sed 's/^/Env key: /'
          else
            echo "Container mpay-v2-php not found."
          fi
          echo "=== Existing MPAY environment files (paths and permissions only) ==="
          find /opt/mpay-v2 /opt -maxdepth 4 -type f -name '.env' -printf '%p mode=%m owner=%u:%g\n' 2>/dev/null | sort -u | head -50 || true
          echo "=== Candidate shared directories ==="
          for d in /opt/mpay-v2 /opt/mpay-v2/shared /opt/mpay-v2/releases /opt/mpay-v2/shared/runtime; do
            if [ -d "$d" ]; then stat -c '%A %U:%G %n' "$d"; fi
          done
          echo "=== Docker networks ==="
          docker network ls --format 'table {{.Name}}\t{{.Driver}}' || true
          echo "=== Existing MPAY staging archives ==="
          find /opt/mpay-v2 -maxdepth 1 -type f -name 'mpay-v2-*.tgz' -printf '%f %s bytes\n' 2>/dev/null | sort | tail -10 || true
          echo "Read-only preflight complete. No .env, database, container, or running files were changed."
          REMOTE
